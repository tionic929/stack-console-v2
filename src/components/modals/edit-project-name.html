<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rename project</title>
  <link rel="stylesheet" href="../../index.css">
</head>
<body>
  <div id="AppContainer">
    <header id="TitleBar">
      <div class="title-left">
        <span id="TitleBarTitle">Rename project</span>
      </div>
      <div class="title-right">
        <button type="button" class="win-btn" id="WinBtnClose" aria-label="Close" title="Close"></button>
      </div>
    </header>

    <form class="modal-body" id="ProjectForm" novalidate>
      <h1 class="sr-only">Rename project</h1>
      <div class="form-group">
        <label for="InpProjName">Project name</label>
        <input type="text" class="input-field" id="InpProjName" placeholder="e.g. My App Stack" aria-describedby="ErrName" required>
        <span class="field-error" id="ErrName" role="alert"></span>
      </div>
    </form>

    <div class="modal-footer-strip">
      <button type="button" class="btn-secondary" id="BtnCancel">Cancel</button>
      <button type="button" class="btn-primary" id="BtnApply">Rename</button>
    </div>
  </div>

  <script src="../../util/icon-map.js"></script>
  <script src="../../util/ui.js"></script>
  <script src="../../util/command-form.js"></script>
  <script src="edit-project-name.js"></script>
</body>
</html>
