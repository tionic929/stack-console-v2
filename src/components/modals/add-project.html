<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New project</title>
  <link rel="stylesheet" href="../../index.css">
</head>
<body>
  <div id="AppContainer">
    <header id="TitleBar">
      <div class="title-left">
        <span id="TitleBarTitle">New project</span>
      </div>
      <div class="title-right">
        <button type="button" class="win-btn" id="WinBtnClose" aria-label="Close" title="Close"></button>
      </div>
    </header>

    <form class="modal-body" id="ProjectForm" novalidate>
      <h1 class="sr-only">New project</h1>
      <div class="form-group">
        <label for="InpName">Project name</label>
        <input type="text" class="input-field" id="InpName" placeholder="e.g. PayrollMS" aria-describedby="ErrName" required>
        <span class="field-error" id="ErrName" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="InpDir">Project folder <span class="label-optional">(optional)</span></label>
        <div class="input-with-action">
          <input type="text" class="input-field mono" id="InpDir" placeholder="C:\projects\my-app" spellcheck="false" aria-describedby="HintDir">
          <button type="button" class="btn-secondary" id="BtnBrowse">Browse…</button>
        </div>
        <span class="field-hint" id="HintDir">Commands run here. StackConsole can import the ones it finds (package.json, artisan, Procfile).</span>
      </div>
    </form>

    <div class="modal-footer-strip">
      <button type="button" class="btn-secondary" id="BtnCancel">Cancel</button>
      <button type="button" class="btn-primary" id="BtnSave">Create project</button>
    </div>
  </div>

  <script src="../../util/icon-map.js"></script>
  <script src="../../util/ui.js"></script>
  <script src="../../util/command-form.js"></script>
  <script src="add-project.js"></script>
</body>
</html>
