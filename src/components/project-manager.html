<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project manager</title>
  <link rel="stylesheet" href="../index.css">
</head>
<body>
  <div id="AppContainer">
    <header id="TitleBar">
      <div class="title-left">
        <span id="TitleBarTitle">Project manager</span>
      </div>
      <div class="title-right">
        <button type="button" class="win-btn" id="WinBtnClose" aria-label="Close" title="Close"></button>
      </div>
    </header>

    <div class="split-manager-view">
      <div class="manager-left-pane">
        <h1 class="sr-only">Project manager</h1>

        <div class="form-group">
          <label for="ProjectDropdownSelector">Project</label>
          <div class="input-with-action">
            <select class="dropdown-select" id="ProjectDropdownSelector" style="flex: 1;"></select>
            <button type="button" class="btn-secondary btn-sm" id="BtnEditProjectName">Rename</button>
            <button type="button" class="btn-secondary btn-sm" id="BtnArchiveProject">Archive</button>
            <button type="button" class="btn-secondary btn-sm" id="BtnNewProject">New project</button>
            <button type="button" class="btn-danger btn-sm" id="BtnDeleteProject">Delete</button>
          </div>
        </div>

        <div class="form-group">
          <label for="InpBaseDir">Project folder</label>
          <div class="input-with-action">
            <input type="text" class="input-field mono" id="InpBaseDir" placeholder="No folder chosen" readonly>
            <button type="button" class="btn-secondary" id="BtnBrowseDirectory">Browse…</button>
          </div>
        </div>

        <div class="form-group" style="flex: 1; min-height: 0;">
          <div class="input-with-action" style="justify-content: space-between; align-items: baseline;">
            <span class="field-label" id="CommandsLabel">Commands</span>
            <span id="ProjectStats" class="field-hint"></span>
          </div>
          <div class="stacked-list-box" id="CommandsListBox" role="listbox" aria-labelledby="CommandsLabel"></div>
        </div>
      </div>

      <div class="manager-right-pane">
        <button type="button" class="btn-primary btn-block" id="MgrAddCmd">+ Add command</button>
        <button type="button" class="btn-secondary btn-block" id="MgrImport">Import from folder…</button>

        <hr class="cmd-action-divider">

        <span class="field-label" id="SelectedLabel">Selected command</span>
        <button type="button" class="btn-secondary btn-block" id="MgrEditCmd">Edit</button>
        <button type="button" class="btn-secondary btn-block" id="MgrStartCmd">Start</button>
        <button type="button" class="btn-secondary btn-block" id="MgrDupCmd">Duplicate</button>

        <hr class="cmd-action-divider">

        <button type="button" class="btn-danger btn-block" id="MgrRemoveCmd">Remove</button>
      </div>
    </div>

    <div class="manager-footer">
      <span id="FooterHint" class="field-hint" aria-live="polite"></span>
      <button type="button" class="btn-primary" id="MgrCloseWindow">Done</button>
    </div>
  </div>

  <script src="../util/icon-map.js"></script>
  <script src="../util/ui.js"></script>
  <script src="project-manager.js"></script>
</body>
</html>
